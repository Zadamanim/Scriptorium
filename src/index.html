<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; font-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Scriptorium</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="viewport">
  <div id="stage">

    <!-- ============ THE WINDOW (title view) ============ -->
    <section id="view-hall" class="screen"><div class="content">
      <div class="wall bleed"></div>
      <div class="moonglow bleed"></div>
      <h1 class="carved">Scriptorium</h1>
      <div class="window-frame"></div>
      <div class="window" id="window">
        <div class="sky"></div>
        <div class="stars" id="stars"></div>
        <div class="moon"></div>
        <div class="cloud c1"></div><div class="cloud c2"></div>
        <img class="hills" src="../assets/scenes/hills.svg" alt="">
        <img class="lattice" src="../assets/scenes/lattice.svg" alt="">
      </div>
      <div class="sill"></div>
      <div class="prop" id="prop-raven" data-tip="A raven at the window, bearing a sealed letter"></div>
      <div class="desk-peek bleed-x"></div>
    </div></section>

    <!-- ============ THE DOORWAY (quit) ============ -->
    <section id="view-door" class="screen"><div class="content">
      <div class="wall bleed"></div>
      <div class="floor-plane"></div>
      <div class="torchlight bleed"></div>
      <div class="prop" id="prop-torch-l"></div>
      <div class="prop" id="prop-torch-r"></div>
      <div class="prop" id="prop-door" data-tip="Leave the Scriptorium (close the app)"></div>
    </div></section>

    <!-- ============ THE LIBRARY ============ -->
    <section id="view-library" class="screen">
      <div id="lib-scroll">
        <div id="lib-inner">
          <div class="wall lib-wall"></div>
          <h1 class="lib-title">The Library</h1>
          <div class="lib-actions">
            <button class="plaque clickable" id="lib-new-shelf">&#10010; Build a New Shelf</button>
            <button class="plaque clickable" id="lib-open-elsewhere" data-tip="Open a .tome kept somewhere else on thy computer">Open a Tome from Elsewhere…</button>
            <button class="plaque clickable" id="lib-reveal" data-tip="Open the Library folder on thy computer">Show the Library Folder</button>
          </div>
          <div id="bookcase"></div>
        </div>
      </div>
    </section>

    <!-- ============ THE READING NOOK (between the Library and the Doorway) ============ -->
    <section id="view-nook" class="screen"><div class="content">
      <div class="wall bleed"></div>
      <div class="floor-plane nook-floor"></div>
      <div class="rug"></div>
      <img class="nook-fireplace" src="../assets/scenes/fireplace.svg" alt="">
      <div class="prop" id="prop-fire"></div>
      <div class="fireglow bleed"></div>
      <img class="nook-chair" src="../assets/scenes/armchair.svg" alt="">
      <img class="nook-table" src="../assets/scenes/sidetable.svg" alt="">
      <div class="prop" id="prop-nook-candle"></div>
      <div class="nook-hint parch">Choose a book in the Library and it shall be read here, by the fire.</div>
      <div class="nook-reading">
        <div class="nook-dim bleed"></div>
        <div class="blanket bleed-x"></div>
        <div id="nook-slot"></div>
        <div class="nook-actions">
          <button class="plaque clickable" id="nook-shelve" data-tip="Close the book and put it back on its shelf">&#10229; Back on the shelf</button>
          <button class="plaque clickable" id="nook-to-desk" data-tip="Carry this book to the writing desk">Take it to the desk &#10230;</button>
        </div>
      </div>
    </div></section>

    <!-- ============ THE DESK ============ -->
    <section id="view-desk" class="screen"><div class="content">
      <div class="wall bleed"></div>
      <div class="desk-plane"></div>
      <div class="desk-backedge bleed-x"></div>
      <div class="lectern">
        <div class="lectern-board"></div>
        <div class="lectern-leg l"></div><div class="lectern-leg r"></div>
        <div class="lectern-ledge"></div>
      </div>
      <div id="book" class="book">
        <div class="cover"></div>
        <div class="page-stack left"></div><div class="page-stack right"></div>
        <div class="spread" id="spread"></div>
        <div class="gutter"></div>
        <div class="front-cover clickable" id="front-cover" data-tip="Open the book"></div>
        <div class="corner prev clickable" id="turn-prev" data-tip="Turn back a leaf"></div>
        <div class="corner next clickable" id="turn-next" data-tip="Turn forward a leaf"></div>
        <div class="clasp clickable" id="clasp" data-tip="The clasp — seal this book with magic words"></div>
      </div>
      <div class="prop" id="prop-candle" data-tip="Snuff the candle and look up from the desk (back to the window)"></div>
      <div class="prop" id="prop-pounce" data-tip="The pounce pot — sprinkle sand to dry the ink (Save, Ctrl+S). Right-click to shelve a copy elsewhere."></div>
      <div class="prop" id="prop-spectacles" data-tip="Spectacles — comfort &amp; scale"></div>
      <div class="prop" id="prop-quill" data-tip="The Quill — thy hand: typeface, size, spacing, lists, pages"></div>
      <div class="prop" id="prop-inkwell" data-tip="The Inkwell — choose thine ink"></div>
      <div id="desk-light" class="bleed"></div>
      <div class="crystal-glow"></div>
      <div class="prop" id="prop-crystal" data-tip="The Crystal Ball — ask it what thou seekest (F1)"></div>
    </div></section>

  </div>
</div>
<div id="vignette"></div>
<div id="edges">
  <div class="edge left" data-dir="left"><span class="edge-arrow">&#10094;</span><span class="edge-label"></span></div>
  <div class="edge right" data-dir="right"><span class="edge-arrow">&#10094;</span><span class="edge-label"></span></div>
  <div class="edge up" data-dir="up"><span class="edge-arrow">&#10094;</span><span class="edge-label"></span></div>
  <div class="edge down" data-dir="down"><span class="edge-arrow">&#10094;</span><span class="edge-label"></span></div>
</div>
<div id="darkness"></div>
<div id="ui-layer"></div>
<div id="tooltip"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
