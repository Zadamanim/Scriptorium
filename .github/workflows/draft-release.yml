# Opens a DRAFT release, with the Windows installer attached, whenever the version in
# package.json changes on main (or a v1.2.3 tag is pushed). Nothing reaches users until a
# human reviews the draft and clicks "Publish": the raven ignores drafts.
name: Draft release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/draft-release.yml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which version is this?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "A release (or draft) for $V already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install NSIS (the installer compiler)
        if: steps.ver.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Install dependencies
        if: steps.ver.outputs.skip != 'true'
        run: npm ci

      - name: Build the installer
        if: steps.ver.outputs.skip != 'true'
        run: bash build-tools/build-installer.sh

      - name: Open a draft release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.tag }}"
          NOTES="release-notes/$V.md"
          if [ ! -f "$NOTES" ]; then NOTES=/tmp/notes.md; echo "Scriptorium ${V#v}" > "$NOTES"; fi
          gh release create "$V" "dist/Scriptorium Setup ${V#v}.exe" \
            --draft --target "$GITHUB_SHA" --title "Scriptorium ${V#v}" --notes-file "$NOTES"
